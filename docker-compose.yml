services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: color
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-color_local}
      POSTGRES_DB: color
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - color_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U color -d color"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  color_data:
